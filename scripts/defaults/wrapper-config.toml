[server]
tcp-port = 9090
http-port = 9090
scan-root = "."
scan-paths = ["mods", "config"]

[server.public]
scheme = "https"
host = "localhost"
port = 9090

[server.tls]
enabled = true
auto-generate = true
keystore = ".vesta/tls.p12"
keystore-password = "vesta-generated"

[server.identity]
# id = "replace-with-a-stable-uuid"
name = "Vesta Server"
banner-url = ""

[modpack]
name = "Vesta Demo Pack"
description = "A demo modpack served by the Vesta sync server."
version = "1.0.0"
revision = 1
minimum-revision = 1
recommended-memory-min-mb = 4096
recommended-memory-max-mb = 8192
minecraft-version = "1.21.4"
# Valid sources:
#   "self-hosted" â€” scan live mods/config and publish hashed files (and later a Vesta pack)
#   "modrinth"    â€” reference a Modrinth project/version (launcher resolves the archive)
#   "curseforge"  â€” reference a CurseForge modpack/file ID (launcher resolves the archive)
#   "archive"     â€” host a local .zip/.mrpack as one authenticated blob (not extracted)
source = "self-hosted"
# server = list on public manifest | private = unknown files are private-only
unresolved-policy = "server"

[modpack.modloader]
type = "fabric"
version = "0.18.4"

# Used when source = "modrinth" or "curseforge".
# CurseForge version-id is the file ID. download-url is an optional override.
[modpack.platform]
project-id = ""
version-id = ""
download-url = ""

# Used only when source = "archive". Path is relative to scan-root (or absolute).
# The wrapper serves this file as-is â€” it does not unpack or re-host its contents.
[modpack.archive]
path = ""

[modpack.server]
host = "localhost"
port = 25565
description = "A Vesta-powered Minecraft server"
is-required = false

# Optional: let the wrapper start and stop the Minecraft server process.
[minecraft]
auto-start = false
launch-jar = "server.jar"
working-directory = "."
java-command = "java"
jvm-args = ["-Xms2G", "-Xmx4G"]
server-args = ["nogui"]

# Optional in-game connector (Fabric/Forge mod or Paper plugin).
# Installers never auto-install it — use a future panel/launcher one-click for
# non-vanilla servers. auto-update is reserved/no-op; leave false.
[connector]
auto-update = false

# open | password | linked | whitelist
[security]
mode = "open"
password = ""
token-ttl-seconds = 86400
control-port = 9091
private-paths = []

# Baseline Vesta levels (0â€“4) for identity classes. Effective level is the max of
# applicable baselines, Minecraft OP level from ops.json (1:1), [security.people],
# and [security.perm-nodes]. Levels need not be cumulative; these defaults are.
anonymous-level = 1
authenticated-level = 1
password-level = 4
linked-level = 1
whitelist-level = 3

# Valid capabilities:
#   stats.read, pack.fetch, console.read, files.read,
#   console.execute, files.write, settings.manage, content.manage
[security.levels]
"0" = ["stats.read"]
"1" = ["stats.read", "pack.fetch"]
"2" = ["stats.read", "pack.fetch", "console.read"]
"3" = ["stats.read", "pack.fetch", "console.read", "files.read"]
"4" = [
  "stats.read",
  "pack.fetch",
  "console.read",
  "files.read",
  "console.execute",
  "files.write",
  "settings.manage",
  "content.manage",
]

# UUID â†’ level grants (in addition to OP / baselines).
# Prefer admin-uuids for level-4 shorthand, or map form:
# [security.people]
# "00000000-0000-0000-0000-000000000001" = 4

# LuckPerms / plugin permission node â†’ level grants (checked via control IPC)
[security.perm-nodes]
"vesta.level.maintainer" = 3
"vesta.level.admin" = 4
"vesta.mods.install" = 4
"vesta.files.private" = 3

# Shorthand: listed UUIDs receive level 4 (merged into security.people)
# admin-uuids = ["00000000-0000-0000-0000-000000000001"]
