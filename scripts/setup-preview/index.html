<!doctype html>
<html lang="en" data-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vesta setup · terminal preview</title>
  <link rel="stylesheet" href="/xterm.css">
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #10151d; color: #dae2ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10151d; }
    .shell { width: min(100%, 1200px); margin: 0 auto; padding: 42px 30px 56px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 22px; margin: 0 0 18px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #356a69; border-radius: 11px; color: #86ddd0; font-weight: 700; font-size: 14px; background: #172a30; }
    .brand-copy { min-width: 0; }
    .eyebrow { color: #93a1b3; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .controls { display: flex; align-items: center; gap: 8px; }
    select, button { height: 36px; border: 1px solid #303b49; border-radius: 8px; background: #171f2a; color: #dae2ed; font: inherit; font-size: 13px; }
    select { width: min(310px, 42vw); padding: 0 34px 0 11px; }
    button { min-width: 38px; padding: 0 10px; cursor: pointer; }
    button:hover, select:hover { border-color: #567b7d; }
    button:focus-visible, select:focus-visible { outline: 2px solid #69cfc2; outline-offset: 2px; }
    .frame { overflow: auto; border: 1px solid #26313e; border-radius: 13px; background: #10151d; box-shadow: 0 20px 60px #0005; padding: 24px; }
    #terminal { display: block; margin: 0 auto; width: max-content; min-width: 0; }
    .xterm { padding: 0; }
    .caption { display: none; color: #8693a4; font-size: 11px; letter-spacing: .03em; }
    body.capture { min-height: auto; }
    body.capture .shell { width: max-content; max-width: 100%; margin: 0; padding: 15px; }
    body.capture .toolbar { display: none; }
    body.capture .frame { width: max-content; max-width: 100%; padding: 17px; border-color: #27323e; box-shadow: none; }
    body.capture #terminal { margin: 0; }
    body.capture .caption { display: block; margin: 0 0 12px 2px; }
    @media (max-width: 700px) {
      .shell { padding: 24px 14px 36px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; }
      select { width: auto; flex: 1; }
      .frame { padding: 15px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="toolbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">V</div>
        <div class="brand-copy"><div class="eyebrow">Local review</div><h1>Setup terminal frames</h1></div>
      </div>
      <div class="controls">
        <button id="prev" type="button" aria-label="Previous state">←</button>
        <select id="states" aria-label="Preview state"></select>
        <button id="next" type="button" aria-label="Next state">→</button>
      </div>
    </header>
    <section class="frame" aria-label="Rust terminal output">
      <div class="caption">Vesta setup · terminal preview</div>
      <div id="terminal"></div>
    </section>
  </main>
  <script src="/xterm.js"></script>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const capture = query.get('capture') === '1';
      if (capture) document.body.classList.add('capture');
      const select = document.querySelector('#states');
      const terminalNode = document.querySelector('#terminal');
      const terminal = new Terminal({
        convertEol: true,
        cursorBlink: false,
        disableStdin: true,
        scrollback: 0,
        fontFamily: '"Cascadia Mono", Consolas, monospace',
        fontSize: 14,
        lineHeight: 1.35,
        theme: { background: '#10151d', foreground: '#dae2ed', cursor: '#10151d', selectionBackground: '#385457' },
      });
      terminal.open(terminalNode);
      let states = [];
      let currentIndex = 0;
      let renderQueue = Promise.resolve();

      function afterPaint() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      function showState(id) {
        renderQueue = renderQueue.then(async () => {
          const index = states.findIndex(state => state.id === id);
          if (index < 0) throw new Error(`Unknown preview state: ${id}`);
          const state = states[index];
          currentIndex = index;
          document.documentElement.dataset.ready = 'false';
          terminal.reset();
          const columns = Math.max(40, Math.min(100, Number(state.columns) || 80));
          const rows = Math.max(20, (String(state.ansi).match(/\n/g) || []).length + 1);
          terminal.resize(columns, rows);
          const cellWidth = terminalNode.querySelector('.xterm-screen')?.getBoundingClientRect().width / columns || 8.5;
          const terminalWidth = Math.ceil(cellWidth * columns);
          terminalNode.style.width = `${terminalWidth}px`;
          terminalNode.style.height = 'auto';
          select.value = state.id;
          window.currentStateId = state.id;
          await new Promise(resolve => terminal.write(String(state.ansi), resolve));
          if (document.fonts?.ready) await document.fonts.ready;
          await afterPaint();
          terminalNode.style.height = `${Math.ceil(terminalNode.querySelector('.xterm-screen').getBoundingClientRect().height)}px`;
          document.documentElement.dataset.ready = 'true';
          return state;
        });
        return renderQueue;
      }

      window.showState = showState;
      select.addEventListener('change', () => showState(select.value).catch(showError));
      document.querySelector('#prev').addEventListener('click', () => {
        if (states.length) showState(states[(currentIndex - 1 + states.length) % states.length].id).catch(showError);
      });
      document.querySelector('#next').addEventListener('click', () => {
        if (states.length) showState(states[(currentIndex + 1) % states.length].id).catch(showError);
      });
      document.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target === select || !states.length) return;
        if (event.key === 'ArrowLeft') showState(states[(currentIndex - 1 + states.length) % states.length].id).catch(showError);
        if (event.key === 'ArrowRight') showState(states[(currentIndex + 1) % states.length].id).catch(showError);
      });

      function showError(error) {
        document.documentElement.dataset.ready = 'error';
        console.error(error);
      }

      fetch('/states.json', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error(`Could not load exported frames (${response.status})`);
        return response.json();
      }).then(data => {
        if (!Array.isArray(data) || data.length === 0) throw new Error('states.json must contain at least one exported Rust frame');
        states = data.filter(state => state && typeof state.id === 'string' && typeof state.ansi === 'string');
        if (!states.length) throw new Error('No valid Rust frames found in states.json');
        for (const state of states) {
          const option = document.createElement('option');
          option.value = state.id;
          option.textContent = state.title || state.id;
          select.append(option);
        }
        const requested = query.get('state');
        const initial = states.find(state => state.id === requested) || states[0];
        return showState(initial.id);
      }).catch(showError);
    })();
  </script>
</body>
</html>
