[package]
name = "vesta-game-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Isolated development consumes the existing versioned crate from its separate
# repository. Release packaging must replace this path with an approved published
# version or immutable repository revision; no sandbox implementation is copied.
vesta-sandbox = { version = "=0.1.0-alpha.31", path = "../../../launcher/crates/vesta-sandbox" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true

# Inert integration fixture, not a supervisor or application entrypoint.
[[bin]]
name = "vesta-game-fixture"
path = "tests/fixtures/game.rs"
test = false
bench = false

[lints]
workspace = true
