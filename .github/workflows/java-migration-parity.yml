name: Pinned Java migration comparison

# Cross-repository reads need a separate credential for private repositories.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require cross-repository read credential
        env:
          READ_TOKEN: ${{ secrets.SERVER_JAVA_READ_TOKEN }}
        run: test -n "$READ_TOKEN" || { echo 'Configure SERVER_JAVA_READ_TOKEN with read access to server-java'; exit 1; }
      - name: Read immutable Java source pin
        id: source
        run: node -e "const s=require('./docs/RUST_WRAPPER_PARITY.json').javaSource; if(s.repository!=='https://github.com/vesta-project/server-java'||!/^[a-f0-9]{40}$/.test(s.revision)) process.exit(1); console.log('revision='+s.revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: vesta-project/server-java
          ref: ${{ steps.source.outputs.revision }}
          token: ${{ secrets.SERVER_JAVA_READ_TOKEN }}
          path: .migration-java
          persist-credentials: false
      - name: Validate real Java evidence and migration inventory
        env:
          VESTA_JAVA_REPO: ${{ github.workspace }}/.migration-java
        run: |
          node --test scripts/requirements-ledger.test.mjs
          node scripts/rust-wrapper-parity.mjs
