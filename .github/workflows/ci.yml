name: CI

on:
  push:
    branches: [main, server-connections-mvp]
  pull_request:
    branches: [main, server-connections-mvp]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check protocol conformance and requirement ledger
        run: |
          node --test scripts/server-feature-protocol.test.mjs scripts/requirements-ledger.test.mjs
          node scripts/requirements-ledger.mjs --check

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :wrapper:test
