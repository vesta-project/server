[server]
tcp-port = 9092
http-port = 9090
scan-root = "."
scan-paths = ["mods", "config"]

[server.public]
scheme = "https"
host = "localhost"
port = 9090

[server.tls]
enabled = true
auto-generate = true
keystore = ".vesta/tls.p12"
keystore-password = "vesta-generated"

[modpack]
name = "Vesta Demo Pack"
description = "A demo modpack served by the Vesta sync server."
version = "1.0.0"
minecraft-version = "1.21.4"
# self-hosted | modrinth | curseforge | archive
source = "self-hosted"
unresolved-policy = "server"

[modpack.modloader]
type = "fabric"
version = "0.18.4"

# For source = "modrinth" or "curseforge", set project-id and version-id.
# Modrinth resolves the archive automatically; CurseForge can also be resolved
# by the launcher. download-url remains an optional override.
[modpack.platform]
project-id = ""
version-id = ""
download-url = ""

# For source = "archive", point at a local .zip/.mrpack under the server root.
[modpack.archive]
path = ""

[modpack.server]
host = "localhost"
port = 25565
description = "A Vesta-powered Minecraft server"
is-required = false

[minecraft]
auto-start = false
launch-jar = "server.jar"
working-directory = "."
java-command = "java"
jvm-args = ["-Xms1G", "-Xmx2G"]
server-args = ["nogui"]

[connector]
auto-update = false

[security]
mode = "open"
password = ""
token-ttl-seconds = 86400
control-port = 9091
anonymous-level = 1
authenticated-level = 1
password-level = 4
linked-level = 1
whitelist-level = 3

[security.levels]
"0" = ["stats.read"]
"1" = ["stats.read", "pack.fetch"]
"2" = ["stats.read", "pack.fetch", "console.read"]
"3" = ["stats.read", "pack.fetch", "console.read", "files.read"]
"4" = [
  "stats.read",
  "pack.fetch",
  "console.read",
  "files.read",
  "console.execute",
  "files.write",
  "settings.manage",
  "content.manage",
]

[security.perm-nodes]
"vesta.level.maintainer" = 3
"vesta.level.admin" = 4
