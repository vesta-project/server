[server]
tcp-port = 9092
http-port = 9090
scan-root = "."
scan-paths = ["mods", "config"]

[server.public]
scheme = "https"
host = "localhost"
port = 9090

[server.tls]
enabled = true
auto-generate = true
keystore = ".vesta/tls.p12"
keystore-password = "vesta-generated"

[modpack]
name = "Vesta Demo Pack"
description = "A demo modpack served by the Vesta sync server."
version = "1.0.0"
minecraft-version = "1.21.4"
unresolved-policy = "server"

[modpack.modloader]
type = "fabric"
version = "0.18.4"

# Leave source empty to serve the demo files below. To test a referenced pack,
# set source/project-id/version-id (Modrinth resolves the archive automatically).
[modpack.platform]
source = ""
project-id = ""
version-id = ""
download-url = ""

[modpack.server]
host = "localhost"
port = 25565
description = "A Vesta-powered Minecraft server"
is-required = false

[minecraft]
auto-start = false
launch-jar = "server.jar"
working-directory = "."
java-command = "java"
jvm-args = ["-Xms1G", "-Xmx2G"]
server-args = ["nogui"]

[security]
mode = "open"
password = ""
token-ttl-seconds = 86400
control-port = 9091

[security.capabilities]
public_modpack = "open"
private_resources = "deny"
manage_content = "perm_or_password"
