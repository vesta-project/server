[workspace]
members = [
    "crates/vesta-protocol",
    "crates/vesta-state",
    "crates/vesta-control",
    "crates/vesta-transport",
    "crates/vesta-game-runtime",
    "crates/vesta-server-install",
    "crates/vesta-supervisor",
    "apps/vesta-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
hyper = { version = "=1.8.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
http = "=1.4.0"
tokio = { version = "=1.50.0", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.14.0", default-features = false, features = ["std"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
vesta-state = { path = "crates/vesta-state" }
vesta-protocol = { path = "crates/vesta-protocol" }
vesta-game-runtime = { path = "crates/vesta-game-runtime" }
vesta-supervisor = { path = "crates/vesta-supervisor" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = { version = "=0.9.12", default-features = false, features = ["std", "parse", "serde"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
fs2 = "=0.4.3"
uuid = { version = "=1.23.2", features = ["v4"] }
getrandom = "=0.4.3"
base64 = "=0.22.1"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
url = "=2.5.8"
zip = { version = "=8.2.0", default-features = false }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
tempfile = "=3.27.0"
libc = "=0.2.183"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[workspace.lints.rust]
# Only isolated, reviewed native adapters and owned test fixtures may opt into unsafe calls.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
