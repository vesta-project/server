[server]
tcp-port = 9092
http-port = 9090
scan-root = "."
scan-paths = ["mods", "config"]

[server.public]
scheme = "https"
host = "localhost"
port = 9090

[server.tls]
enabled = true
auto-generate = true
keystore = ".vesta/tls.p12"
keystore-password = "vesta-generated"

[server.identity]
# id = "replace-with-a-stable-uuid"
name = "Vesta Server"
banner-url = ""

[modpack]
name = "Vesta Demo Pack"
description = "A demo modpack served by the Vesta sync server."
version = "1.0.0"
revision = 1
minimum-revision = 1
recommended-memory-min-mb = 4096
recommended-memory-max-mb = 8192
minecraft-version = "1.21.4"
# Valid sources:
#   "self-hosted" — scan live mods/config and publish hashed files (and later a Vesta pack)
#   "modrinth"    — reference a Modrinth project/version (launcher resolves the archive)
#   "curseforge"  — reference a CurseForge modpack/file ID (launcher resolves the archive)
#   "archive"     — host a local .zip/.mrpack as one authenticated blob (not extracted)
source = "self-hosted"
# server = list on public manifest | private = unknown files are private-only
unresolved-policy = "server"

[modpack.modloader]
type = "fabric"
version = "0.18.4"

# Used when source = "modrinth" or "curseforge".
# CurseForge version-id is the file ID. download-url is an optional override.
[modpack.platform]
project-id = ""
version-id = ""
download-url = ""

# Used only when source = "archive". Path is relative to scan-root (or absolute).
# The wrapper serves this file as-is — it does not unpack or re-host its contents.
[modpack.archive]
path = ""

[modpack.server]
host = "localhost"
port = 25565
description = "A Vesta-powered Minecraft server"
is-required = false

# Optional: let the wrapper start and stop the Minecraft server process.
[minecraft]
auto-start = false
launch-jar = "server.jar"
working-directory = "."
java-command = "java"
jvm-args = ["-Xms2G", "-Xmx4G"]
server-args = ["nogui"]

# open | password | linked | whitelist
[security]
mode = "open"
password = ""
token-ttl-seconds = 86400
control-port = 9091
op-grants-manage = true
private-paths = []

[security.capabilities]
public_modpack = "open"
private_resources = "deny"
manage_content = "perm_or_password"

[security.permissions]
install = "vesta.mods.install"
private_read = "vesta.files.private"

# security.admin-uuids = ["00000000-0000-0000-0000-000000000001"]
