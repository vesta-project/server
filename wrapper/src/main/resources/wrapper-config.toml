[server]
tcp-port = 9090
http-port = 9090
file-store = "vesta-files"
scan-root = "."
scan-paths = ["mods", "config"]

[server.public]
scheme = "http"
host = "localhost"
port = 9090

[modpack]
name = "Vesta Demo Pack"
description = "A demo modpack served by the Vesta sync server."
version = "1.0.0"
minecraft-version = "1.21.4"

[modpack.modloader]
type = "fabric"
version = "0.18.4"

[modpack.server]
host = "localhost"
port = 25565
description = "A Vesta-powered Minecraft server"
is-required = false

# open | password | linked — open logs a loud warning at startup
[security]
mode = "open"
password = ""
token-ttl-seconds = 86400
control-port = 9091
